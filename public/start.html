<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Cron - Status</title>
<style>
  :root {
    --bg: #0e0f12;
    --panel: #17181d;
    --panel-2: #1e2027;
    --border: #2a2c34;
    --text: #e6e6ea;
    --text-dim: #8a8c98;
    --accent: #6ea8fe;
    --ok: #4ade80;
    --fail: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Mono", Menlo, monospace;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 32px;
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 { font-size: 17px; margin: 0 0 6px; }
  .sub { color: var(--text-dim); font-size: 12.5px; margin-bottom: 22px; }
  .dot-row {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 8px 16px; border-radius: 999px; font-size: 13px; font-weight: 600;
    background: var(--panel-2); border: 1px solid var(--border); margin-bottom: 20px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .dot.checking { background: var(--text-dim); animation: pulse 1.2s infinite; }
  .dot.down { background: var(--fail); }
  .dot.up { background: var(--ok); }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  button {
    font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--accent);
    background: var(--accent); color: #0e0f12; font-weight: 600; padding: 11px 22px; font-size: 14px;
    width: 100%;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .hint { color: var(--text-dim); font-size: 11.5px; margin-top: 14px; line-height: 1.5; }
  .error { color: var(--fail); font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>

<div class="card">
  <h1>AI Cron</h1>
  <div class="sub">daemon status check</div>

  <div class="dot-row" id="status-row">
    <span class="dot checking" id="status-dot"></span>
    <span id="status-text">checking...</span>
  </div>

  <div id="action-area"></div>
  <div class="error" id="error-text"></div>
  <div class="hint">this page works even when the dashboard is down - use it to bring pm2 back and jump straight in</div>
</div>

<script>
const DASHBOARD_URL = "http://localhost:47890";
const WATCHDOG_URL = "http://localhost:47891";

const dot = document.getElementById("status-dot");
const text = document.getElementById("status-text");
const actionArea = document.getElementById("action-area");
const errorText = document.getElementById("error-text");

async function isDashboardUp() {
  try {
    const res = await fetch(DASHBOARD_URL + "/api/health", { cache: "no-store" });
    return res.ok;
  } catch {
    return false;
  }
}

function setChecking() {
  dot.className = "dot checking";
  text.textContent = "checking...";
  actionArea.innerHTML = "";
}

function setUp() {
  dot.className = "dot up";
  text.textContent = "dashboard online";
  actionArea.innerHTML = "";
  setTimeout(() => { window.location.href = DASHBOARD_URL; }, 600);
}

function setDown() {
  dot.className = "dot down";
  text.textContent = "dashboard not running";
  actionArea.innerHTML = '<button id="start-btn">Start</button>';
  document.getElementById("start-btn").onclick = startDaemon;
}

async function startDaemon() {
  const btn = document.getElementById("start-btn");
  btn.disabled = true;
  btn.textContent = "starting...";
  errorText.textContent = "";
  try {
    const res = await fetch(WATCHDOG_URL + "/start", { method: "POST" });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(body.error || ("watchdog returned " + res.status));
    }
  } catch (err) {
    errorText.textContent = "start failed: " + err.message;
    btn.disabled = false;
    btn.textContent = "Start";
    return;
  }
  btn.textContent = "waiting for dashboard...";
  pollUntilUp();
}

async function pollUntilUp(attempts = 0) {
  if (await isDashboardUp()) {
    setUp();
    return;
  }
  if (attempts > 30) {
    errorText.textContent = "still not up after 30s - check the Terminal / pm2 logs";
    const btn = document.getElementById("start-btn");
    if (btn) { btn.disabled = false; btn.textContent = "Start"; }
    return;
  }
  setTimeout(() => pollUntilUp(attempts + 1), 1000);
}

async function check() {
  setChecking();
  if (await isDashboardUp()) setUp();
  else setDown();
}

check();
</script>

</body>
</html>
